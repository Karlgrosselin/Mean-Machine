<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meat Sheet — Mean Machine Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #eab308;
      --accent-blue: #38bdf8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .league-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-yellow);
      margin-bottom: 4px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 1.8rem;
    }

    .tagline {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .stat-card {
      background-color: var(--card-bg);
      padding: 12px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-val {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .stat-lbl {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .stat-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .picks-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pick-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .matchup {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .conf-tag {
      background-color: #334155;
      color: var(--accent-yellow);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .card-mid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .pick-details {
      font-size: 0.9rem;
    }

    .highlight-pick {
      color: var(--accent-blue);
      font-weight: 700;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bg-win { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.4); }
    .bg-loss { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }
    .bg-covering { background-color: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .bg-trailing { background-color: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .bg-upcoming { background-color: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.3); }

    .card-bot {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .score-line {
      display: flex;
      justify-content: space-between;
      color: var(--text-main);
      font-weight: 600;
    }

    .position-line {
      font-size: 0.8rem;
    }

    .pos-good { color: var(--accent-green); }
    .pos-bad { color: var(--accent-red); }
    .pos-neutral { color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="league-title">Meat Sheet League</div>
      <h1>Team: Mean Machine</h1>
      <div class="tagline">"Run your guts out, and you’ll have something in here."</div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="stat-record">0 - 0 - 0</div>
          <div class="stat-lbl">Our Record</div>
          <div class="stat-sub" id="stat-record-sub">0 Pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-locked" style="color: var(--accent-green);">0 / 55</div>
          <div class="stat-lbl">Locked Points</div>
          <div class="stat-sub" id="stat-win-pct">0.0% Win Rate</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-live" style="color: var(--accent-yellow);">0 / 55</div>
          <div class="stat-lbl">In Play / Max</div>
          <div class="stat-sub" id="stat-max-sub">Max Possible</div>
        </div>
      </div>
    </header>

    <div class="picks-list" id="picks-container">
      <div style="text-align: center; color: var(--text-muted); padding: 30px;">
        Fetching live scores and updating dashboard...
      </div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const picksRes = await fetch('picks.json');
        const picks = await picksRes.json();

        const [cfbRes, nflRes] = await Promise.all([
          fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard').catch(() => null),
          fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard').catch(() => null)
        ]);

        const cfbData = cfbRes ? await cfbRes.json() : {};
        const nflData = nflRes ? await nflRes.json() : {};
        const events = [...(cfbData.events || []), ...(nflData.events || [])];

        let wins = 0;
        let losses = 0;
        let ties = 0;
        let inProgressCount = 0;

        let lockedPts = 0;
        let livePts = 0;
        let maxPts = 55;

        const container = document.getElementById('picks-container');
        container.innerHTML = '';

        picks.forEach(p => {
          const game = events.find(e => {
            const name = e.name.toLowerCase();
            return name.includes(p.homeTeam.toLowerCase()) || name.includes(p.awayTeam.toLowerCase());
          });

          let statusText = "UPCOMING";
          let statusBg = "bg-upcoming";
          let scoreLineHtml = `<div>Status: Scheduled</div><div>--</div>`;
          let positionLineHtml = `<div class="pos-neutral">Need ${p.pick} ${p.spread > 0 ? '+' : ''}${p.spread}</div>`;

          if (game) {
            const comp = game.competitions[0];
            const home = comp.competitors.find(c => c.homeAway === 'home');
            const away = comp.competitors.find(c => c.homeAway === 'away');

            const hScore = parseInt(home.score || 0);
            const aScore = parseInt(away.score || 0);
            const state = comp.status.type.state;
            const isFinished = comp.status.type.completed;

            const isPickedHome = p.pick.toLowerCase() === p.homeTeam.toLowerCase();
            const pickedScore = isPickedHome ? hScore : aScore;
            const oppScore = isPickedHome ? aScore : hScore;
            const currentMargin = (pickedScore - oppScore) + p.spread;

            if (state === 'in' || isFinished) {
              const clockText = comp.status.type.shortDetail || (isFinished ? "FINAL" : "LIVE");
              scoreLineHtml = `
                <div>${away.team.abbreviation || p.awayTeam} ${aScore} - ${home.team.abbreviation || p.homeTeam} ${hScore}</div>
                <div>${clockText}</div>
              `;

              if (isFinished) {
                if (currentMargin > 0) {
                  statusText = "WIN";
                  statusBg = "bg-win";
                  wins++;
                  lockedPts += p.confidence;
                  positionLineHtml = `<div class="pos-good">Covered by +${currentMargin.toFixed(1)} pts</div>`;
                } else if (currentMargin < 0) {
                  statusText = "LOSS";
                  statusBg = "bg-loss";
                  losses++;
                  maxPts -= p.confidence;
                  positionLineHtml = `<div class="pos-bad">Missed cover by ${Math.abs(currentMargin).toFixed(1)} pts</div>`;
                } else {
                  statusText = "PUSH";
                  statusBg = "bg-upcoming";
                  ties++;
                  positionLineHtml = `<div class="pos-neutral">Pushed (Exact Spread)</div>`;
                }
              } else {
                inProgressCount++;
                if (currentMargin > 0) {
                  statusText = "COVERING";
                  statusBg = "bg-covering";
                  livePts += p.confidence;
                  positionLineHtml = `<div class="pos-good">Currently covering by +${currentMargin.toFixed(1)} pts</div>`;
                } else if (currentMargin < 0) {
                  statusText = "TRAILING";
                  statusBg = "bg-trailing";
                  positionLineHtml = `<div class="pos-bad">Currently trailing by ${Math.abs(currentMargin).toFixed(1)} pts</div>`;
                } else {
                  statusText = "TIED SPREAD";
                  statusBg = "bg-upcoming";
                  positionLineHtml = `<div class="pos-neutral">Currently right on spread (Push)</div>`;
                }
              }
            } else {
              const dateObj = new Date(game.date);
              const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              const dayStr = dateObj.toLocaleDateString([], { weekday: 'short' });
              scoreLineHtml = `<div>Kickoff: ${dayStr} ${timeStr}</div><div>Scheduled</div>`;
            }
          }

          const spreadFormatted = p.spread > 0 ? `+${p.spread}` : `${p.spread}`;

          container.innerHTML += `
            <div class="pick-card">
              <div class="card-top">
                <div class="matchup">${p.awayTeam} @ ${p.homeTeam}</div>
                <div class="conf-tag">${p.confidence} Pts</div>
              </div>
              <div class="card-mid">
                <div class="pick-details">
                  Our Pick: <span class="highlight-pick">${p.pick}</span> (${spreadFormatted})
                </div>
                <div class="status-badge ${statusBg}">${statusText}</div>
              </div>
              <div class="card-bot">
                <div class="score-line">${scoreLineHtml}</div>
                <div class="position-line">${positionLineHtml}</div>
              </div>
            </div>
          `;
        });

        const totalDecided = wins + losses + ties;
        const winRate = totalDecided > 0 ? ((wins / totalDecided) * 100).toFixed(1) : "0.0";

        document.getElementById('stat-record').innerText = `${wins} - ${losses} - ${ties}`;
        document.getElementById('stat-record-sub').innerText = `${inProgressCount} In Progress`;
        
        document.getElementById('stat-locked').innerText = `${lockedPts} / 55`;
        document.getElementById('stat-win-pct').innerText = `${winRate}% Win Rate`;

        document.getElementById('stat-live').innerText = `${livePts} / ${maxPts}`;
        document.getElementById('stat-max-sub').innerText = `Max Possible: ${maxPts} Pts`;

      } catch (err) {
        console.error("Dashboard error:", err);
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
