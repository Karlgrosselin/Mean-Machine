<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meat Sheet — Mean Machine Dashboard</title>
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: #131c2e;
      --card-bg-elevated: #1a263d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #eab308;
      --accent-blue: #38bdf8;
      --border-color: #27354f;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 800px; }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .league-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-yellow);
      margin-bottom: 4px;
      font-weight: 700;
    }

    h1 { margin: 0 0 4px 0; font-size: 1.8rem; }

    .tagline {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .stat-card {
      background-color: var(--card-bg);
      padding: 12px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-val { font-size: 1.3rem; font-weight: 800; }
    .stat-lbl {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .stat-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

    .picks-list { display: flex; flex-direction: column; gap: 16px; }

    .pick-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 2px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .pick-card.card-win {
      border-color: var(--accent-green);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.08) 0%, var(--card-bg) 100%);
    }

    .pick-card.card-covering {
      border-color: var(--accent-green);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.3);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.12) 0%, var(--card-bg) 100%);
    }

    .pick-card.card-loss {
      border-color: var(--accent-red);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, var(--card-bg) 100%);
    }

    .pick-card.card-trailing {
      border-color: var(--accent-red);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.3);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.12) 0%, var(--card-bg) 100%);
    }

    .pick-card.card-upcoming { border-color: var(--border-color); }

    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background-color: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid var(--border-color);
    }

    .card-header-bar.live-covering {
      background-color: rgba(34, 197, 94, 0.2);
      color: var(--accent-green);
      border-bottom: 1px solid rgba(34, 197, 94, 0.4);
    }

    .card-header-bar.live-trailing {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
      border-bottom: 1px solid rgba(239, 68, 68, 0.4);
    }

    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .matchup { font-weight: 700; font-size: 1.05rem; color: var(--text-main); }

    .card-mid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg-elevated);
      padding: 10px 12px;
      border-radius: 8px;
    }

    .pick-details { font-size: 0.95rem; }
    .highlight-pick { color: var(--accent-blue); font-weight: 700; }

    .status-badge {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bg-win, .bg-covering {
      background-color: rgba(34, 197, 94, 0.25);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .bg-loss, .bg-trailing {
      background-color: rgba(239, 68, 68, 0.25);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    .bg-upcoming {
      background-color: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .live-dot {
      width: 8px; height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    .live-dot-red {
      width: 8px; height: 8px;
      background-color: var(--accent-red);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    .card-bot {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .score-line { display: flex; justify-content: space-between; color: var(--text-main); font-weight: 600; }
    .position-line { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 600; }

    .pos-good { color: var(--accent-green); }
    .pos-bad { color: var(--accent-red); }
    .pos-neutral { color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="league-title">Meat Sheet League</div>
      <h1>Team: Mean Machine</h1>
      <div class="tagline">"Run your guts out, and you’ll have something in here."</div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="stat-record">0 - 0 - 0</div>
          <div class="stat-lbl">Our Record</div>
          <div class="stat-sub" id="stat-record-sub">0 Pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-locked" style="color: var(--accent-green);">0 / 55</div>
          <div class="stat-lbl">Locked Points</div>
          <div class="stat-sub" id="stat-win-pct">0.0% Win Rate</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-live" style="color: var(--accent-yellow);">0 / 55</div>
          <div class="stat-lbl">In Play / Max</div>
          <div class="stat-sub" id="stat-max-sub">Max Possible</div>
        </div>
      </div>
    </header>

    <div class="picks-list" id="picks-container">
      <div style="text-align: center; color: var(--text-muted); padding: 30px;">
        Fetching live scores and updating dashboard...
      </div>
    </div>
  </div>

  <script>
    function cleanName(str) {
      return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '').replace(/st$/, 'state');
    }

    function isTeamMatch(teamA, teamB) {
      const a = cleanName(teamA);
      const b = cleanName(teamB);
      if (!a || !b) return false;
      return a === b || a.includes(b) || b.includes(a);
    }

    // Normal Cumulative Distribution Function for Cover Probability
    function normCDF(x) {
      const t = 1 / (1 + 0.2316419 * Math.abs(x));
      const d = 0.3989423 * Math.exp(-x * x / 2);
      let prob = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      if (x > 0) prob = 1 - prob;
      return prob;
    }

    function calculateCoverProb(margin, period, clockSec) {
      if (period >= 4 && clockSec === 0) return margin > 0 ? 100 : 0;
      const totalSec = 3600; // 60 mins
      const elapsedSec = Math.min(totalSec, Math.max(0, ((period - 1) * 900) + (900 - clockSec)));
      const remainingSec = Math.max(1, totalSec - elapsedSec);
      
      const stdDev = 13.5 * Math.sqrt(remainingSec / totalSec);
      const prob = normCDF(margin / stdDev) * 100;
      return Math.min(99.9, Math.max(0.1, prob)).toFixed(1);
    }

    async function loadDashboard() {
      try {
        const picksRes = await fetch('picks.json');
        const picks = await picksRes.json();

        const [cfbRes, nflRes] = await Promise.all([
          fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard').catch(() => null),
          fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard').catch(() => null)
        ]);

        const cfbData = cfbRes ? await cfbRes.json() : {};
        const nflData = nflRes ? await nflRes.json() : {};
        const events = [...(cfbData.events || []), ...(nflData.events || [])];

        let wins = 0, losses = 0, ties = 0, inProgressCount = 0;
        let lockedPts = 0, livePts = 0, maxPts = 55;

        // Process pick cards
        const processedPicks = picks.map(p => {
          const game = events.find(e => {
            const comp = e.competitions[0];
            const home = comp.competitors.find(c => c.homeAway === 'home');
            const away = comp.competitors.find(c => c.homeAway === 'away');

            const hName = home.team.displayName || home.team.name || '';
            const aName = away.team.displayName || away.team.name || '';
            const hShort = home.team.shortDisplayName || home.team.abbreviation || '';
            const aShort = away.team.shortDisplayName || away.team.abbreviation || '';

            return (isTeamMatch(p.homeTeam, hName) || isTeamMatch(p.homeTeam, hShort)) &&
                   (isTeamMatch(p.awayTeam, aName) || isTeamMatch(p.awayTeam, aShort));
          });

          let matchupDisplay = `${p.awayTeam} @ ${p.homeTeam}`;
          let statusText = "UPCOMING";
          let statusBg = "bg-upcoming";
          let cardBorderClass = "card-upcoming";
          let headerBarClass = "";
          let headerText = "SCHEDULED";
          let scoreLineHtml = `<div>Game Clock</div><div>Scheduled</div>`;
          let positionLineHtml = `<div class="pos-neutral">Need ${p.pick} ${p.spread > 0 ? '+' : ''}${p.spread}</div><div>Prob: 50.0%</div>`;
          
          // Sort Priority: 1 = LIVE, 2 = UPCOMING, 3 = FINAL
          let sortPriority = 2;

          if (game) {
            const comp = game.competitions[0];
            const home = comp.competitors.find(c => c.homeAway === 'home');
            const away = comp.competitors.find(c => c.homeAway === 'away');

            const hScore = parseInt(home.score || 0);
            const aScore = parseInt(away.score || 0);
            const state = comp.status.type.state;
            const isFinished = comp.status.type.completed;

            const isPickedHome = isTeamMatch(p.pick, home.team.displayName) || isTeamMatch(p.pick, home.team.name) || isTeamMatch(p.pick, p.homeTeam);
            const pickedScore = isPickedHome ? hScore : aScore;
            const oppScore = isPickedHome ? aScore : hScore;
            const currentMargin = (pickedScore - oppScore) + p.spread;

            if (state === 'in' || isFinished) {
              const clockText = comp.status.type.shortDetail || (isFinished ? "FINAL" : "LIVE");
              matchupDisplay = `${p.awayTeam} ${aScore} @ ${p.homeTeam} ${hScore}`;
              scoreLineHtml = `<div>Game Clock</div><div>${clockText}</div>`;

              if (isFinished) {
                sortPriority = 3;
                headerText = "FINAL";
                if (currentMargin > 0) {
                  statusText = "WIN";
                  statusBg = "bg-win";
                  cardBorderClass = "card-win";
                  wins++;
                  lockedPts += p.confidence;
                  positionLineHtml = `<div class="pos-good">✓ Covered (+${currentMargin.toFixed(1)} pts)</div><div>Prob: 100%</div>`;
                } else if (currentMargin < 0) {
                  statusText = "LOSS";
                  statusBg = "bg-loss";
                  cardBorderClass = "card-loss";
                  losses++;
                  maxPts -= p.confidence;
                  positionLineHtml = `<div class="pos-bad">✗ Missed (-${Math.abs(currentMargin).toFixed(1)} pts)</div><div>Prob: 0%</div>`;
                } else {
                  statusText = "PUSH";
                  statusBg = "bg-upcoming";
                  cardBorderClass = "card-upcoming";
                  ties++;
                  positionLineHtml = `<div class="pos-neutral">Pushed</div><div>Prob: 0%</div>`;
                }
              } else {
                sortPriority = 1;
                inProgressCount++;
                headerText = `🟢 LIVE — ${clockText}`;
                
                const period = comp.status.period || 1;
                const clockStr = comp.status.displayClock || "15:00";
                const parts = clockStr.split(':');
                const clockSec = parts.length === 2 ? (parseInt(parts[0]) * 60 + parseInt(parts[1])) : 0;
                
                const coverProb = calculateCoverProb(currentMargin, period, clockSec);

                if (currentMargin > 0) {
                  statusText = `<span class="live-dot"></span> COVERING`;
                  statusBg = "bg-covering";
                  cardBorderClass = "card-covering";
                  headerBarClass = "live-covering";
                  livePts += p.confidence;
                  positionLineHtml = `<div class="pos-good">Covering by +${currentMargin.toFixed(1)} pts</div><div>Prob: ${coverProb}%</div>`;
                } else if (currentMargin < 0) {
                  statusText = `<span class="live-dot-red"></span> TRAILING`;
                  statusBg = "bg-trailing";
                  cardBorderClass = "card-trailing";
                  headerBarClass = "live-trailing";
                  headerText = `🔴 LIVE — ${clockText}`;
                  positionLineHtml = `<div class="pos-bad">Trailing by ${Math.abs(currentMargin).toFixed(1)} pts</div><div>Prob: ${coverProb}%</div>`;
                } else {
                  statusText = `<span class="live-dot"></span> TIED SPREAD`;
                  statusBg = "bg-upcoming";
                  cardBorderClass = "card-upcoming";
                  positionLineHtml = `<div class="pos-neutral">Even on spread</div><div>Prob: 50.0%</div>`;
                }
              }
            } else {
              sortPriority = 2;
              const dateObj = new Date(game.date);
              const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              const dayStr = dateObj.toLocaleDateString([], { weekday: 'short' });
              headerText = `UPCOMING — ${dayStr} ${timeStr}`;
              scoreLineHtml = `<div>Kickoff: ${dayStr} ${timeStr}</div><div>Scheduled</div>`;
            }
          }

          const spreadFormatted = p.spread > 0 ? `+${p.spread}` : `${p.spread}`;

          return {
            sortPriority,
            confidence: p.confidence,
            html: `
              <div class="pick-card ${cardBorderClass}">
                <div class="card-header-bar ${headerBarClass}">
                  <div>${headerText}</div>
                  <div>${p.confidence} CONF PTS</div>
                </div>
                <div class="card-body">
                  <div class="card-top">
                    <div class="matchup">${matchupDisplay}</div>
                  </div>
                  <div class="card-mid">
                    <div class="pick-details">
                      Our Pick: <span class="highlight-pick">${p.pick}</span> (${spreadFormatted})
                    </div>
                    <div class="status-badge ${statusBg}">${statusText}</div>
                  </div>
                  <div class="card-bot">
                    <div class="score-line">${scoreLineHtml}</div>
                    <div class="position-line">${positionLineHtml}</div>
                  </div>
                </div>
              </div>
            `
          };
        });

        // Sort: LIVE first (1), UPCOMING second (2), FINAL third (3); then by confidence points high to low
        processedPicks.sort((a, b) => a.sortPriority - b.sortPriority || b.confidence - a.confidence);

        const container = document.getElementById('picks-container');
        container.innerHTML = processedPicks.map(p => p.html).join('');

        const totalDecided = wins + losses + ties;
        const winRate = totalDecided > 0 ? ((wins / totalDecided) * 100).toFixed(1) : "0.0";

        document.getElementById('stat-record').innerText = `${wins} - ${losses} - ${ties}`;
        document.getElementById('stat-record-sub').innerText = `${inProgressCount} In Progress`;
        document.getElementById('stat-locked').innerText = `${lockedPts} / 55`;
        document.getElementById('stat-win-pct').innerText = `${winRate}% Win Rate`;
        document.getElementById('stat-live').innerText = `${livePts} / ${maxPts}`;
        document.getElementById('stat-max-sub').innerText = `Max Possible: ${maxPts} Pts`;

      } catch (err) {
        console.error("Dashboard error:", err);
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
